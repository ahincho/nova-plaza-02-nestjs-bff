# pnpm rechaza por defecto una versión publicada hace muy poco: es la defensa
# contra un mantenedor comprometido que publica algo malicioso y lo ve
# instalado al instante. La política cuida de terceros, y los paquetes de la
# plataforma son propios.
minimumReleaseAgeExclude:
  - '@ahincho/nova-*'

# pnpm 10+ bloquea los scripts de instalación de las dependencias y aborta el
# install si nadie decidió qué hacer con ellos, así que sin esta decisión un
# `pnpm install` limpio falla antes de compilar nada.
#
# Va en false porque el script de `@scarf/scarf` es telemetría: le reporta al
# mantenedor que alguien instaló el paquete. Llega arrastrado por
# `swagger-ui-dist`, dentro de `@nestjs/swagger`, y apagarlo no le quita nada:
# la documentación se sirve igual.
allowBuilds:
  '@scarf/scarf': false

# Un rango de peer que no se cumple deja de ser una advertencia y pasa a romper
# el install. Es lo que impide terminar en una combinación que la plataforma no
# declara soportar: el aviso se lee cuando ya falló algo, el install fallido se
# lee al instante.
strictPeerDependencies: true

# Todo lo que este servicio usa llega dentro de los tres paquetes de la
# plataforma, y pnpm aisla node_modules: un paquete transitivo no se puede
# importar. Sin esto el `import { Module } from '@nestjs/common'` corta con
# TS2307.
#
# La lista es solo de lo que se importa o lo que resuelve el tsconfig. Las
# herramientas que únicamente se ejecutan -oxlint, tsgolint, prettier,
# dependency-cruiser- no estan, porque el comando `nova` las resuelve desde el
# toolchain.
#
# Es la contrapartida de que el servicio no elija ninguna versión.
publicHoistPattern:
  - '@nestjs/*'
  - '@types/*'
  - rxjs
  - reflect-metadata
  - class-validator
  - class-transformer
  - typescript
  - vitest
  - supertest
